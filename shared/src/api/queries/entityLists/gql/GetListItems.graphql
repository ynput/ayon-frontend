query GetListItems(
  $projectName: String!
  $listId: String!
  $first: Int
  $after: String
  $before: String
  $last: Int
  $sortBy: String
  $filter: String
  $search: String
  $showComments: Boolean! = false
  # entity attributes to fetch (node attrib), all attributes when not set
  $attribNames: [String!]
  # list attribute values only exist on the item (allAttrib), which has no names filter:
  # when true, allAttrib is used instead of the node attrib
  $withListAttrib: Boolean! = true
) {
  project(name: $projectName) {
    entityLists(ids: [$listId]) {
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        node {
          id
          active
          items(
            first: $first
            after: $after
            before: $before
            last: $last
            sortBy: $sortBy
            filter: $filter
            search: $search
          ) {
            pageInfo {
              hasNextPage
              hasPreviousPage
              endCursor
            }
            edges {
              id
              entityId
              entityType
              allAttrib @include(if: $withListAttrib)
              ownItemAttrib: ownAttrib
              position
              node {
                ...ListItemFragment
              }
            }
          }
        }
      }
    }
  }
}
