fragment TaskPropsFragment on TaskNode {
  id
  folderId
  label
  name
  ownAttrib
  status
  tags
  taskType
  updatedAt
  createdAt
  thumbnailHash
  active
  assignees
  attrib(names: $attribNames)
  hasReviewables
  parents
  data
  subtasks {
    ...SubTaskFragment
  }
  latestComments @include(if: $showComments) {
    activityId
    body
    author
    createdAt
  }
  folder {
    folderType
  }
}
