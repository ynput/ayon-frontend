# Column summary stats over the folder set of the table (Overview footer).
# Takes the same filters as the table's folder search (REST /folders/search),
# includeParents adds the parents the hierarchy shows. Targets are built from the
# visible columns so the backend only aggregates what the footer shows.
query GetFolderColumnStats(
  $projectName: String!
  $filter: String
  $search: String
  $taskFilter: String
  $taskSearch: String
  $globalSearch: String
  $includeParents: Boolean
  $parentIds: [String!]
  $ids: [String!]
  $targets: [MetricTargetInput!]
  $includeFolderChildren: Boolean! = true
  $hideEmptyFolders: Boolean
) {
  project(name: $projectName) {
    name
    folders(
      calculateSpecificStatistics: $targets
      filter: $filter
      search: $search
      taskFilter: $taskFilter
      taskSearch: $taskSearch
      globalSearch: $globalSearch
      includeParents: $includeParents
      parentIds: $parentIds
      ids: $ids
      includeFolderChildren: $includeFolderChildren
      hasTasks: $hideEmptyFolders
    ) {
      fieldStats {
        ...ColumnStatsFragment
      }
    }
  }
}
