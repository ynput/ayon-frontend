fragment VersionExtended on VersionNode {
  ...VersionBase
  task {
    id
    taskType
    label
    name
    status
    attrib(names: $taskAttribNames)
  }
  product {
    id
    name
    productType
    productBaseType
    attrib(names: $productAttribNames)
    folder {
      id
      ...VPFolder
    }
  }
}
