fragment VersionBase on VersionNode {
  name
  id
  hasReviewables
  parents
  path
  active
  attrib(names: $versionAttribNames)
  author
  createdAt
  status
  tags
  updatedAt
  thumbnailHash
  version
  featuredVersionType
  heroVersionId
  latestComments @include(if: $showComments) {
    activityId
    body
    author
    createdAt
  }
}
