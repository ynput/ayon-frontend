fragment VersionBase on VersionNode {
  name
  id
  hasReviewables
  parents
  path
  active
  allAttrib
  author
  createdAt
  createdBy
  status
  tags
  updatedAt
  updatedBy
  thumbnailHash
  version
  featuredVersionType
  heroVersionId
  latestComments @include(if: $showComments) {
    activityId
    body
    author
    createdAt
  }
}
