fragment ActivityFragment on ActivityNode {
  activityId
  activityType
  activityData
  referenceType
  referenceId
  entityId
  body
  createdAt
  updatedAt
  author {
    name
    deleted
    active
    attrib(names: ["fullName"])
  }
  files {
    id
    name
    size
    mime
    mediaInfo
  }
  origin {
    id
    name
    label
    type
  }
  reactions {
    fullName
    userName
    reaction
    timestamp
  }
  version {
    thumbnailHash
    status
    attrib(names: ["comment"])
  }
}
