# addon/AGENTS.md is generated by addon/scripts/generate-docs.mjs. A hand edit is lost on the next
# build (and then fails the release scripts), so a pull request that leaves it out of date fails here.
name: Addon docs

on:
  pull_request:
    paths:
      - addon/**

jobs:
  agents-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: node addon/scripts/generate-docs.mjs --check
